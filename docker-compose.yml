services:
  # ── Private npm Registry (Verdaccio) ────────────────────────
  verdaccio:
    image: verdaccio/verdaccio:5
    container_name: hce-verdaccio
    ports:
      - "10100:4873"
    volumes:
      - ./docker/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
    environment:
      - VERDACCIO_PUBLIC_URL=http://localhost:10100
    restart: unless-stopped

  # ── Storybook (static build served by nginx) ────────────────
  # SSL opcional via nginx-entrypoint.sh (mismo mecanismo ya probado en
  # HCE-MF-PLATFORM/docker/nginx-entrypoint.sh) -- con USE_SSL=true pero
  # sin certs montados en CERT_PATH, sigue sirviendo HTTP puro sin
  # romperse, asi que queda seguro dejarlo siempre en true.
  storybook:
    build:
      context: .
      dockerfile: docker/storybook/Dockerfile
    container_name: hce-storybook
    restart: unless-stopped
    ports:
      - "10101:80"
      - "20101:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  # ── Publisher (build + publish to Verdaccio) ────────────────
  publisher:
    build:
      context: .
      dockerfile: docker/publisher/Dockerfile
    container_name: hce-publisher
    environment:
      - VERDACCIO_URL=http://verdaccio:4873
      - NPM_TOKEN=${NPM_TOKEN:-}
    depends_on:
      - verdaccio
    profiles:
      - publish

volumes:
  verdaccio-storage:
networks:
  default:
    name: hce-shared-network