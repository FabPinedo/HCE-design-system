services:
  # ── Storybook (static build served by nginx) ────────────────
  # SSL opcional via nginx-entrypoint.sh (mismo mecanismo ya probado en
  # HCE-MF-PLATFORM/docker/nginx-entrypoint.sh) -- con USE_SSL=true pero
  # sin certs montados en CERT_PATH, sigue sirviendo HTTP puro sin
  # romperse, asi que queda seguro dejarlo siempre en true.
  storybook:
    build:
      context: .
      dockerfile: docker/storybook/Dockerfile
    container_name: hce-storybook
    restart: unless-stopped
    ports:
      - "10101:80"
      - "20101:443"
    environment:
      PORT: "80"
      SSL_PORT: "443"
      USE_SSL: "true"
      CERT_PATH: /proyectos/certs
      NGINX_TYPE: spa
    volumes:
      - /proyectos/certs:/proyectos/certs:ro

  # ── Publisher (build + publish al Verdaccio externo) ────────
  # Verdaccio ya no vive en este repo: corre en el repo hermano
  # hce-verdaccio-registry (puerto de host 10100). host.docker.internal
  # resuelve al host en Windows/Mac y con host-gateway en Linux, así que
  # no depende de una red Docker compartida.
  publisher:
    build:
      context: .
      dockerfile: docker/publisher/Dockerfile
    container_name: hce-publisher
    environment:
      - VERDACCIO_URL=http://host.docker.internal:10100
      - NPM_TOKEN=${NPM_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - publish
